          - type: 'null'
          description: Last timeline entry.
          examples:
          - null
          title: Last Activity At
        contacts:
          description: Contacts of the company.
          items:
            $ref: '#/components/schemas/ContactResponse'
          title: Contacts
          type: array
        activities:
          description: Last 20 timeline entries, newest first.
          items:
            $ref: '#/components/schemas/ActivityResponse'
          title: Activities
          type: array
      required:
      - id
      - name
      - domain
      - website
      - company_type
      - industry
      - description
      - platform
      - hooks
      - stage
      - stage_entered_at
      - source
      - external_ref
      - do_not_contact
      - customer_uid
      - rotation_count
      - last_activity_at
      - contacts
      - activities
      title: CompanyDetailResponse
      type: object
    CompanyListResponse:
      properties:
        count:
          description: Total matching rows.
          examples:
          - 1
          title: Count
          type: integer
        next:
          anyOf:
          - type: string
          - type: 'null'
          description: Next page URL.
          examples:
          - null
          title: Next
        previous:
