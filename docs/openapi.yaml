components:
  schemas:
    ActivityListResponse:
      properties:
        count:
          description: Total matching rows.
          examples:
          - 1
          title: Count
          type: integer
        next:
          anyOf:
          - type: string
          - type: 'null'
          description: Next page URL.
          examples:
          - null
          title: Next
        previous:
          anyOf:
          - type: string
          - type: 'null'
          description: Previous page URL.
          examples:
          - null
          title: Previous
        results:
          description: Timeline entries, newest first.
          items:
            $ref: '#/components/schemas/ActivityResponse'
          title: Results
          type: array
      required:
      - count
      - next
      - previous
      - results
      title: ActivityListResponse
      type: object
    ActivityResponse:
      properties:
        id:
          description: Activity id.
          examples:
          - 1
          title: Id
          type: integer
        company_id:
          description: Company id.
          examples:
          - 100
          title: Company Id
          type: integer
        contact_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Contact id.
          examples:
          - null
          title: Contact Id
        kind:
          description: Activity kind.
          examples:
          - import
          title: Kind
          type: string
        message:
          description: Short description.
          examples:
          - import matched
          title: Message
          type: string
        data:
          additionalProperties: true
          description: Structured details.
          examples:
          - {}
          title: Data
          type: object
        actor:
          description: Username, system or import:<batch id>.
          examples:
          - system
          title: Actor
          type: string
        created_at:
          description: Created.
          examples:
          - '2026-09-13T12:00:00Z'
          format: date-time
          title: Created At
          type: string
      required:
      - id
      - company_id
      - contact_id
      - kind
      - message
      - data
      - actor
      - created_at
      title: ActivityResponse
      type: object
    AnalysisProfileDetailResponse:
      properties:
        id:
          description: Profile id.
          examples:
          - 100
          title: Id
          type: integer
        key:
          description: Profile key.
          examples:
          - leads.analysis
          title: Key
          type: string
        model:
          description: Toolbox model.
          examples:
          - fake-chat
          title: Model
          type: string
        prompt_text:
          description: Prompt with placeholders.
          examples:
          - '...'
          title: Prompt Text
          type: string
        json_schema:
          additionalProperties: true
          description: Output JSON schema.
          examples:
          - {}
          title: Json Schema
          type: object
        is_active:
          description: Used by the analysis.
          examples:
          - true
          title: Is Active
          type: boolean
      required:
      - id
      - key
      - model
      - prompt_text
      - json_schema
      - is_active
      title: AnalysisProfileDetailResponse
      type: object
    AnalysisProfileListResponse:
      properties:
        results:
          description: Profiles of the channel.
          items:
            $ref: '#/components/schemas/AnalysisProfileResponse'
          title: Results
          type: array
      required:
      - results
      title: AnalysisProfileListResponse
      type: object
    AnalysisProfileRequest:
      additionalProperties: false
      properties:
        key:
          description: Profile key.
          maxLength: 64
          minLength: 1
          pattern: ^[-a-zA-Z0-9_.]+$
          title: Key
          type: string
        prompt_text:
          description: Prompt with placeholders.
          minLength: 1
          title: Prompt Text
          type: string
        json_schema:
          additionalProperties: true
          description: Output JSON schema.
          title: Json Schema
          type: object
        model:
          description: Toolbox model.
          examples:
          - fake-chat
          maxLength: 128
          minLength: 1
          title: Model
          type: string
        is_active:
          default: true
          description: Used by the analysis.
          title: Is Active
          type: boolean
      required:
      - key
      - prompt_text
      - model
      title: AnalysisProfileRequest
      type: object
    AnalysisProfileResponse:
      properties:
        id:
          description: Profile id.
          examples:
          - 100
          title: Id
          type: integer
        key:
          description: Profile key.
          examples:
          - leads.analysis
          title: Key
          type: string
        model:
          description: Toolbox model.
          examples:
          - fake-chat
          title: Model
          type: string
        is_active:
          description: Used by the analysis.
          examples:
          - true
          title: Is Active
          type: boolean
      required:
      - id
      - key
      - model
      - is_active
      title: AnalysisProfileResponse
      type: object
    AuditRequestedResponse:
      properties:
        audit_id:
          description: siteintel audit id.
          examples:
          - 6f1c...
          title: Audit Id
          type: string
        status:
          description: Audit status.
          examples:
          - pending
          title: Status
          type: string
      required:
      - audit_id
      - status
      title: AuditRequestedResponse
      type: object
    CommunicateRequest:
      additionalProperties: false
      properties:
        template_key:
          description: Communicator template.
          examples:
          - lead.cold.b2b
          maxLength: 128
          minLength: 1
          title: Template Key
          type: string
        contact_id:
          description: Contact of the company.
          examples:
          - 102
          title: Contact Id
          type: integer
      required:
      - template_key
      - contact_id
      title: CommunicateRequest
      type: object
    CompanyCreateRequest:
      additionalProperties: false
      properties:
        domain:
          description: Domain or URL; stored registrable.
          maxLength: 253
          minLength: 1
          title: Domain
          type: string
        name:
          default: ''
          description: Company name; the domain when empty.
          maxLength: 255
          title: Name
          type: string
        website:
          anyOf:
          - format: uri
            maxLength: 2083
            minLength: 1
            type: string
          - type: 'null'
          default: null
          description: Website URL.
          title: Website
        company_type:
          $ref: '#/components/schemas/CompanyType'
          default: UNKNOWN
          description: Company type.
        industry:
          default: ''
          description: Industry.
          maxLength: 128
          title: Industry
          type: string
      required:
      - domain
      title: CompanyCreateRequest
      type: object
    CompanyDetailResponse:
      properties:
        id:
          description: Company id.
          examples:
          - 100
          title: Id
          type: integer
        name:
          description: Name.
          examples:
          - Example Shop
          title: Name
          type: string
        domain:
          description: Registrable domain.
          examples:
          - example-shop-2.test
          title: Domain
          type: string
        website:
          description: Website.
          examples:
          - ''
          title: Website
          type: string
        company_type:
          description: MANUFACTURER, WHOLESALE, RETAILER or UNKNOWN.
          examples:
          - RETAILER
          title: Company Type
          type: string
        industry:
          description: Industry.
          examples:
          - ''
          title: Industry
          type: string
        description:
          description: Description.
          examples:
          - ''
          title: Description
          type: string
        platform:
          description: Shop platform.
          examples:
          - ''
          title: Platform
          type: string
        hooks:
          description: Outreach hooks (read-only).
          examples:
          - []
          items: {}
          title: Hooks
          type: array
        stage:
          $ref: '#/components/schemas/StageResponse'
          description: Current stage.
        stage_entered_at:
          description: Entered the current stage.
          examples:
          - '2026-09-13T12:00:00Z'
          format: date-time
          title: Stage Entered At
          type: string
        source:
          description: csv, form, manual or connector.
          examples:
          - csv
          title: Source
          type: string
        external_ref:
          description: External reference.
          examples:
          - ''
          title: External Ref
          type: string
        do_not_contact:
          description: Never contact.
          examples:
          - false
          title: Do Not Contact
          type: boolean
        customer_uid:
          anyOf:
          - type: string
          - type: 'null'
          description: Linked customer uid (read-only).
          examples:
          - null
          title: Customer Uid
        rotation_count:
          description: Contact rotations.
          examples:
          - 0
          title: Rotation Count
          type: integer
        last_activity_at:
          anyOf:
          - format: date-time
