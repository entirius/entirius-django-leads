
[project]
name = "entirius-django-leads"
version = "0.1.0"
description = "Leads and B2B pipeline for the Volkanos platform: companies, contacts, stages, rules and recipient selection"
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "pydantic[email]>=2.0",
    "celery>=5.3",
    "celery-once>=3.0.1",
    "tldextract>=5.3",
    "entirius-django-utils>=2.0.0",
    "entirius-django-regional>=2.0.1",
    "entirius-django-agreements>=2.1.0",
    "entirius-django-communicator>=0.1.0",
    "entirius-django-siteintel>=0.1.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
# Soft dependency: form submissions become contacts only when django_contact_forms is installed.
contact-forms = ["entirius-django-contact-forms"]
# Soft dependency: reply and analysis failures notify sales admins only when django_notifications is installed.
notifications = ["entirius-django-notifications>=0.1.0"]
test = [
    "pytest",
    "pytest-django",
    "factory-boy",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.0",
    "entirius-django-contact-forms",
    "entirius-django-notifications>=0.1.0",
]

[project.entry-points.leads_connectors]
csv = "django_leads.connectors.csv:CsvConnector"
twenty = "django_leads.connectors.twenty:TwentyConnector"

[project.urls]
Repository = "https://github.com/entirius/entirius-django-leads"

# agreements 2.1.0, utils 2.1.0 and the leads-platform modules are not on PyPI until their releases — resolve the sibling clones.
[tool.uv.sources]
entirius-django-agreements = { path = "../entirius-django-agreements", editable = true }
entirius-django-contact-forms = { path = "../entirius-django-contact-forms", editable = true }
entirius-django-communicator = { path = "../entirius-django-communicator", editable = true }
entirius-django-siteintel = { path = "../entirius-django-siteintel", editable = true }
entirius-django-notifications = { path = "../entirius-django-notifications", editable = true }
entirius-django-utils = { path = "../entirius-django-utils", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_leads"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["django_leads"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
