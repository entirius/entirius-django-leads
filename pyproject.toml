
[project]
name = "entirius-django-leads"
version = "0.5.0"
description = "Leads and B2B pipeline module for Entirius: companies, contacts, stages, rules and recipient selection; an AI CRM agent (REST API v2 and MCP) and prospecting"
keywords = ["django", "leads", "crm", "b2b", "sales-pipeline", "gdpr", "ecommerce", "ai", "agent", "mcp", "prospecting", "entirius"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "pydantic[email]>=2.0",
    "celery>=5.3",
    "celery-once>=3.0.1",
    "tldextract>=5.3",
    "entirius-django-utils>=2.4.0",
    "entirius-django-regional>=2.0.1",
    "entirius-django-agreements>=2.1.0",
    "entirius-django-communicator>=0.4.0",
    "entirius-django-siteintel>=0.1.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
# Soft dependency: form submissions become contacts only when django_contact_forms is installed.
contact-forms = ["entirius-django-contact-forms"]
# Soft dependency: reply and analysis failures notify sales admins only when django_notifications is installed.
notifications = ["entirius-django-notifications>=0.1.0"]
# Soft dependency django_todo (replies become tasks, tasks show in the timeline): the extra
# `todo = ["entirius-django-todo>=0.1.0"]` lands with the first todo release on PyPI — a requirement PyPI cannot
# resolve breaks `uv lock`. Until then the host installs entirius-django-todo next to leads; the `test` extra takes it
# from GitHub (`tool.uv.sources`, dev and CI only — published metadata stays PyPI-only).
test = [
    "pytest",
    "pytest-django",
    "factory-boy",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.0",
    "entirius-django-contact-forms",
    "entirius-django-notifications>=0.1.0",
    # tests/ai_crm: the chat's toolbox calls are mocked (django_utils.toolbox.testing).
    "respx>=0.21",
    # tests/ai_crm: tasks (django_todo) behind the access gate (django_access).
    "entirius-django-todo>=0.1.0",
    "entirius-django-access>=1.1.0",
]

[project.entry-points.leads_connectors]
csv = "django_leads.connectors.csv:CsvConnector"
twenty = "django_leads.connectors.twenty:TwentyConnector"

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-leads/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-leads"
Changelog = "https://github.com/entirius/entirius-django-leads/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-leads/issues"

# todo 0.1.0 and communicator 0.5.0 (reply_plan_service, which leads imports) are not on PyPI yet: dev and CI resolve
# them from GitHub until their releases; then these two lines go.
[tool.uv.sources]
entirius-django-todo = { git = "https://github.com/entirius/entirius-django-todo", branch = "develop" }
entirius-django-communicator = { git = "https://github.com/entirius/entirius-django-communicator", branch = "develop" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One distribution, three Django apps: django_leads, and the optional django_ai_crm and django_prospecting
# (each only when the host lists it in INSTALLED_APPS).
packages = ["src/django_leads", "src/django_ai_crm", "src/django_prospecting"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["django_leads", "django_ai_crm", "django_prospecting"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
